---
- name: Configure iptables for 3x-ui panel
  hosts: vps-servers
  become: yes
  vars:
    allowed_ports_tcp:
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS
      - 65432 # Custom VPN port
    allowed_source: "0.0.0.0/0"

  tasks:
    - name: Install iptables-persistent
      apt:
        name: iptables-persistent
        state: present
        update_cache: yes

    - name: Allow established and related connections
      iptables:
        chain: INPUT
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        comment: "Prevent lockout of current session"

    - name: Allow loopback interface
      iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Allow ICMP (ping)
      iptables:
        chain: INPUT
        protocol: icmp
        icmp_type: echo-request
        jump: ACCEPT

    - name: Allow incoming TCP ports
      iptables:
        chain: INPUT
        protocol: tcp
        source: "{{ allowed_source }}"
        destination_port: "{{ item }}"
        jump: ACCEPT
      loop: "{{ allowed_ports_tcp }}"

    - name: Allow incoming UDP ports
      iptables:
        chain: INPUT
        protocol: udp
        source: "{{ allowed_source }}"
        destination_port: "{{ item }}"
        jump: ACCEPT
      loop: "{{ allowed_ports_udp }}"

    - name: Set default policies to DROP
      iptables:
        chain: "{{ item.chain }}"
        policy: "{{ item.policy }}"
      loop:
        - { chain: 'INPUT', policy: 'DROP' }
        - { chain: 'FORWARD', policy: 'DROP' }
        - { chain: 'OUTPUT', policy: 'ACCEPT' }

    - name: Save iptables rules
      shell: iptables-save > /etc/iptables/rules.v4
      # Убираем 'creates', чтобы правила обновлялись при изменении списка портов
      changed_when: true 

    - name: Ensure netfilter-persistent is enabled
      systemd:
        name: netfilter-persistent
        enabled: yes
        state: restarted

    - name: Show current iptables rules
      command: iptables -L -n -v
      register: iptables_result
      changed_when: false

    - name: Display iptables rules
      debug:
        var: iptables_result.stdout_lines